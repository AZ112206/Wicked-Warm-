[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-cost-predictor"
version = "0.1.0"
description = "Estimates residential heating energy costs and heat-pump savings for a house in a given region (Massachusetts primary)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["energy_cost_predictor*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
